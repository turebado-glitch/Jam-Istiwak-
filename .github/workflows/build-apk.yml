name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Jam Istiwak APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Prepare project files
        run: |
          WORKDIR="${{ runner.temp }}/jam_istiwak_build"
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            if git cat-file -e c2e3eeb:jam-istiwak.zip 2>/dev/null; then
              git show c2e3eeb:jam-istiwak.zip > "${{ runner.temp }}/restored.zip"
              ZIP_FILE="${{ runner.temp }}/restored.zip"
            fi
          fi
          if [ -f "package.json" ]; then
            cp -a . "$WORKDIR/"
          elif [ -n "$ZIP_FILE" ]; then
            mkdir -p "${{ runner.temp }}/unzip_tmp"
            unzip -o "$ZIP_FILE" -d "${{ runner.temp }}/unzip_tmp"
            PKG_PATH=$(find "${{ runner.temp }}/unzip_tmp" -maxdepth 3 -name "package.json" | head -n 1)
            if [ -z "$PKG_PATH" ]; then
              echo "package.json tidak ditemukan di dalam $ZIP_FILE"
              exit 1
            fi
            SRC_DIR=$(dirname "$PKG_PATH")
            cp -a "$SRC_DIR"/. "$WORKDIR/"
          else
            echo "Tidak ditemukan package.json maupun file .zip"
            exit 1
          fi

      - name: Install npm dependencies
        working-directory: ${{ runner.temp }}/jam_istiwak_build
        run: npm install

      - name: Build web bundle
        working-directory: ${{ runner.temp }}/jam_istiwak_build
        run: npm run build

      - name: Generate Android Capacitor project
        working-directory: ${{ runner.temp }}/jam_istiwak_build
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android manifest & app name
        working-directory: ${{ runner.temp }}/jam_istiwak_build
        run: |
          if [ -f "scripts/configure-android.mjs" ]; then
            node scripts/configure-android.mjs
          fi

      - name: Generate launcher icons from Logo 1 (no border)
        working-directory: ${{ runner.temp }}/jam_istiwak_build
        run: |
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --break-system-packages --quiet pillow
          python3 - << 'EOF'
          import os
          from PIL import Image

          logo_path = "public/assets/aistudio/AddText_11-15-02.54.03_e415f4f9.png"
          res_dir = "android/app/src/main/res"
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          if os.path.exists(logo_path):
              img = Image.open(logo_path).convert("RGBA")
              for folder, size in sizes.items():
                  out_dir = os.path.join(res_dir, folder)
                  os.makedirs(out_dir, exist_ok=True)
                  resized = img.resize((size, size), Image.Resampling.LANCZOS)
                  resized.save(os.path.join(out_dir, "ic_launcher.png"), "PNG")
                  resized.save(os.path.join(out_dir, "ic_launcher_round.png"), "PNG")
              print("Launcher icons generated successfully.")
          else:
              print("Logo not found, keeping default icon.")
          EOF

      - name: Build Debug APK
        working-directory: ${{ runner.temp }}/jam_istiwak_build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Package APK artifact
        run: |
          mkdir -p "${{ github.workspace }}/release-apk"
          cp "${{ runner.temp }}/jam_istiwak_build/android/app/build/outputs/apk/debug/app-debug.apk" "${{ github.workspace }}/release-apk/Jam-Istiwak-v1.0.${{ github.run_number }}.apk"

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Jam-Istiwak-APK
          path: release-apk/*.apk
          retention-days: 30
